[package]
name = "mydaemon-client"
description = "Client library for mydaemond: sync, async (tokio) and mio flavors"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mydaemon-proto = { path = "../proto", default-features = false }
thiserror.workspace = true
log.workspace = true
tokio = { workspace = true, optional = true, features = ["net", "rt", "sync", "time"] }
tokio-util = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
mio = { workspace = true, optional = true }

[features]
default = ["sync", "tokio", "mio"]
# std threads only, no async runtime.
sync = ["mydaemon-proto/sync"]
# `async` module, requires the caller to run inside a tokio runtime.
tokio = ["dep:tokio", "dep:tokio-util", "dep:futures-util", "mydaemon-proto/tokio"]
# Non-blocking client for callers that own a mio event loop.
mio = ["dep:mio", "mydaemon-proto/sync"]

[dev-dependencies]
mydaemond = { path = "../daemon" }
mio.workspace = true
mydaemon-proto = { path = "../proto", features = ["sync"] }
simple_logger.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "signal"] }

[[test]]
name = "sync"
required-features = ["sync"]

[[test]]
name = "async"
required-features = ["tokio"]

[[test]]
name = "mio"
required-features = ["mio"]

[[example]]
name = "sync"
required-features = ["sync"]

[[example]]
name = "mio_events"
required-features = ["mio"]

[[example]]
name = "async_events"
required-features = ["tokio"]
