[package]
name = "mydaemon-client"
description = "Client library for mydaemond, blocking and/or tokio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mydaemon-proto = { path = "../proto", default-features = false }
thiserror.workspace = true
log.workspace = true
tokio = { workspace = true, optional = true, features = ["net", "rt", "sync", "time"] }
tokio-util = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[features]
default = ["blocking", "tokio"]
# std threads only, no async runtime.
blocking = ["mydaemon-proto/sync"]
# async API, requires the caller to run inside a tokio runtime.
tokio = ["dep:tokio", "dep:tokio-util", "dep:futures-util", "mydaemon-proto/tokio"]

[dev-dependencies]
mydaemond = { path = "../daemon" }
mydaemon-proto = { path = "../proto", features = ["sync"] }
simple_logger.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "signal"] }

[[test]]
name = "blocking"
required-features = ["blocking"]

[[test]]
name = "tokio"
required-features = ["tokio"]

[[example]]
name = "blocking"
required-features = ["blocking"]

[[example]]
name = "async_events"
required-features = ["tokio"]
