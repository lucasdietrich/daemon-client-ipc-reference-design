[package]
name = "mydaemond"
description = "Single-threaded mio daemon serving mydaemon-client over a Unix socket"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mydaemon-proto = { path = "../proto", default-features = false }
mio.workspace = true
clap.workspace = true
thiserror.workspace = true
log.workspace = true
simple_logger.workspace = true

[dev-dependencies]
mydaemon-proto = { path = "../proto", features = ["sync"] }
tempfile.workspace = true
